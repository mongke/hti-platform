# HTI KPI MCP server. Hardened 2026-10-14 (MCP security best practices, OWASP MCP guide):
#   * network: mcp-kpi sits ONLY on two internal networks - mcp_edge (Caddy) and
#     hti-mcp-data (spark-thrift). No route to the databases on the platform network,
#     none to the internet, no published port. The SSH-tunnel path is gone: connect via
#     https://datamgt.esukh.mn/mcp (OAuth). The static MCP_TOKEN works only from inside
#     these networks (operator tests), never through Caddy.
#   * containers: read-only root fs, all Linux capabilities dropped (Caddy keeps only
#     NET_BIND_SERVICE), no-new-privileges, memory/CPU/PID limits, rotated logs.
services:
  mcp-kpi:
    build: .
    container_name: hti-mcp-kpi
    restart: unless-stopped
    env_file: [.env]                       # MCP_TOKEN (600)
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging: &logs                      # journald: shipped to central Loki by ../logship (promtail)
      driver: journald
      options: {tag: "{{.Name}}"}
    environment:
      THRIFT_HOST: spark-thrift
      THRIFT_PORT: "10000"
      MCP_RATE_PER_MIN: "60"               # per OAuth client; server.py reads silver only (hardened 2026-10-14)
      MCP_QUERY_TIMEOUT: "60"              # seconds; the Spark query is cancelled after this
      MCP_MAX_CONCURRENT: "4"              # Spark queries at once
      MCP_MAX_ROWS: "200"
      MCP_PUBLIC_URL: "https://datamgt.esukh.mn"   # OAuth issuer; Caddy terminates TLS
    volumes:
      - mcp_oauth:/data                            # registered clients + tokens (sqlite)
    networks: [mcp_edge, mcp_data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f   # caddy:2-alpine, pinned
    container_name: hti-caddy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging: *logs
    ports:
      - "80:80"        # public on purpose: ACME challenge + redirect to https
      - "443:443"      # public on purpose: the only HTI service reachable from outside
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [mcp_edge, egress]          # egress: ACME / Let's Encrypt and inbound 80/443
    depends_on: [mcp-kpi]
volumes:
  mcp_oauth:
  caddy_data:
  caddy_config:
networks:
  mcp_edge:
    internal: true                        # Caddy <-> mcp-kpi only
  egress: {}                              # Caddy only
  mcp_data:
    name: hti-mcp-data                    # defined in ../docker-compose.yml with spark-thrift
    external: true
