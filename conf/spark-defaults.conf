# =============================================================================
# hti-platform/conf/spark-defaults.conf                                NEW FILE
#
# Read by EVERY Spark process in the platform: the thrift server (dbt) and
# every spark-submit job (loader, tokenize, vacuum). Keep it engine-level;
# job-specific settings go in the job.
#
# No secrets here. CHANGED (N1): the metastore password is no longer passed
# at launch - conf/spark-entrypoint.sh writes it into hive-site.xml inside
# the container, because start-thriftserver.sh echoes its launch command to
# the log (G5). This file is bind-mounted read-only and copied into
# SPARK_CONF_DIR (/tmp/spark-conf) at start, alongside that hive-site.xml.
# =============================================================================

# Jars from --packages are loaded into a child classloader at runtime; the Hive
# metastore (DataNucleus/BoneCP) resolves JDBC drivers via DriverManager, which
# only sees the JVM boot classpath. Put the downloaded jars there too.
# On a brand-new install the first start still fails once (nothing downloaded
# yet) and Docker's restart policy makes the second start succeed.
spark.driver.extraClassPath                         /tmp/ivy/jars/*

# ---- Delta Lake ---------------------------------------------------------------
spark.sql.extensions                                io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                     org.apache.spark.sql.delta.catalog.DeltaCatalog
# CREATE TABLE without an explicit USING clause -> Delta (dbt-spark still sets file_format explicitly)
spark.sql.sources.default                           delta
# ADDED: sources.default alone is NOT enough through the Hive catalog. Spark 3.x
# defaults this to true, which makes an unqualified CREATE TABLE a Hive SerDe
# (text) table and silently ignores sources.default - verified: the smoke test
# produced TextInputFormat/LazySimpleSerDe and no _delta_log. Text tables cannot
# do N3's MERGE, N5's VACUUM, or the <=24h bronze retention in policy section 4.
spark.sql.legacy.createHiveTableByDefault           false

# ---- Packages -------------------------------------------------------------------
# Pinned. Spark 3.5.x <-> Delta 3.3.x. Downloaded once into the ivy-cache volume.
#   delta-spark      : Delta Lake
#   postgresql       : Hive metastore backend (metastore-db) + later gold -> serving Postgres export
#   mysql-connector-j: JDBC reads from the esukh / Parkly / MyProperty read-only nodes
spark.jars.packages                                 io.delta:delta-spark_2.12:3.3.2,org.postgresql:postgresql:42.7.7,com.mysql:mysql-connector-j:9.3.0
spark.jars.ivy                                      /tmp/ivy

# ---- Catalog: Hive metastore in Postgres (shared by thrift server + jobs) ----------
# Holds table names -> lake paths only. Without a shared metastore, tables created
# by the loader would be invisible to dbt and vice-versa.
spark.sql.catalogImplementation                     hive
spark.sql.warehouse.dir                             file:///lake/warehouse
spark.hadoop.javax.jdo.option.ConnectionURL         jdbc:postgresql://metastore-db:5432/metastore
spark.hadoop.javax.jdo.option.ConnectionDriverName  org.postgresql.Driver
spark.hadoop.javax.jdo.option.ConnectionUserName    metastore
# CHANGED (G8): was 'true'. DataNucleus built the schema lazily, table by table,
# as each feature was first used - which raced the first CREATE TABLE and
# deadlocked (FK DDL waiting on TBLS vs. an open insert transaction), with no
# error anywhere: beeline simply hung. The schema is now seeded up front by
# conf/metastore-schema.sql via docker-entrypoint-initdb.d, so nothing needs
# creating at runtime and the race cannot happen - including under the parallel
# Airflow tasks of N8.
spark.hadoop.datanucleus.schema.autoCreateAll       false
spark.hadoop.hive.metastore.schema.verification     false

# ---- Lake layout (referenced by jobs; not read by Spark itself) --------------------
# bronze     file:///lake/bronze       raw copy, PII, TTL <= 24h (vacuum job)
# bronze-ref file:///lake/bronze-ref   non-PII reference tables, longer retention
# silver     file:///lake/silver       tokenized, dbt-owned
# gold       file:///lake/gold         aggregates, dbt-owned, exported to serving Postgres
# warehouse  file:///lake/warehouse    default location for tables created without LOCATION

# ---- Single-node sizing --------------------------------------------------------------
# Defaults assume a cluster (200 shuffle partitions). On one box with ~10 GB
# sources this only creates thousands of tiny files.
# ADDED 2026-10-04 (G10). Delta VACUUM lists a table's files with
# spark.sql.sources.parallelPartitionDiscovery.parallelism tasks - default 10,000.
# On a two-file bronze table that is 10,000 near-empty tasks at ~30 ms each, so
# vacuum_bronze.py took ~2 minutes PER TABLE (~2 h for 69 tables, ~5 h for five
# systems) and every nightly run would have overrun into the day. One node,
# tiny tables: 8 is plenty.
spark.sql.sources.parallelPartitionDiscovery.parallelism  8
# ADDED 2026-10-04. Source systems carry placeholder dates (MySQL '0000-00-00'
# arrives as 0001-01-01) and Spark 3 refuses to write pre-1582 timestamps to
# Parquet unless told how to rebase (WRITE_ANCIENT_DATETIME). CORRECTED = write
# the proleptic-Gregorian value as-is; nothing here reads Spark-2-era files.
spark.sql.parquet.datetimeRebaseModeInWrite         CORRECTED
spark.sql.parquet.int96RebaseModeInWrite            CORRECTED
spark.sql.parquet.datetimeRebaseModeInRead          CORRECTED
spark.sql.parquet.int96RebaseModeInRead             CORRECTED
spark.sql.shuffle.partitions                        8
spark.default.parallelism                           8
spark.sql.adaptive.enabled                          true
spark.sql.adaptive.coalescePartitions.enabled       true
spark.driver.maxResultSize                          1g
spark.serializer                                    org.apache.spark.serializer.KryoSerializer

# ---- Thrift server (dbt / BI queries) ----------------------------------------------------
# Stream result rows instead of collecting the whole result on the driver first.
spark.sql.thriftServer.incrementalCollect           true

# ---- Privacy notes -------------------------------------------------------------------------
# * Delta VACUUM's 7-day safety check is deliberately NOT disabled here. The bronze
#   vacuum job disables it in its own session only:
#     spark.databricks.delta.retentionDurationCheck.enabled=false
# * The Spark UI (:4040) shows SQL statement text, which can contain literal values.
#   It is bound to 127.0.0.1 in docker-compose.yml; keep it that way.
# * Event logging stays off (default) so no query history is written to disk.
